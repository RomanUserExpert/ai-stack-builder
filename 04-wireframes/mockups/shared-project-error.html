<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Shared project · error — wireframe — design</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&family=Geist+Mono:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../../07-ui-assembly/ui/kit.css">
</head>
<body class="product-page">
<svg class="sprite" width="0" height="0" aria-hidden="true"><symbol id="l-unlink" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="m18.84 12.25 1.72-1.71h-.02a5.004 5.004 0 0 0-.12-7.07 5.006 5.006 0 0 0-6.95 0l-1.72 1.71" />
  <path d="m5.17 11.75-1.71 1.71a5.004 5.004 0 0 0 .12 7.07 5.006 5.006 0 0 0 6.95 0l1.71-1.71" />
  <line x1="8" x2="8" y1="2" y2="5" />
  <line x1="2" x2="5" y1="8" y2="8" />
  <line x1="16" x2="16" y1="19" y2="22" />
  <line x1="19" x2="22" y1="16" y2="16" /></symbol></svg>

  <!-- Product canvas, 1440 wide -->
  <div class="canvas">

    <header class="shared-header">
      <span class="product"><span class="icon logo" aria-hidden="true"></span>AI Stack Builder</span>
    </header>

    <main class="app-main">

      <!-- Error: the dead link — the only place in the product where somebody can be left with nothing at all.
           So it says what happened, what they still have, and ends there — flows.md's Stuck, the one state with no action (Q35). The sign-in is not offered: a receiver meets it only by choosing to copy (Q25). No owner name: it may be gone. -->
      <section class="state-block" aria-label="This link doesn’t open anything any more">
        <svg class="icon state-icon" aria-hidden="true"><use href="#l-unlink"/></svg>
        <h2>This link doesn’t open anything any more</h2>
        <p>The person who shared this project turned the link off, or deleted the project. Ask them for a new link. If you already exported an archive or copied items from it, those are still yours.</p>
      </section>

    </main>

  </div>

</body>
</html>
