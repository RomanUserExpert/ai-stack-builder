<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>02 · Sign in — the only door, and chosen — prototype · receiver-copy — design</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&family=Geist+Mono:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../../../../08-design-tokens/tokens.css">
  <link rel="stylesheet" href="../../../../08-design-tokens/components/index.css">
  <script>/* theme: ?theme=light, from the viewer's switch (phase 08) */(function(){var d=document.documentElement;window.dsTheme=function(t){if(t==='light')d.setAttribute('data-theme','light');else d.removeAttribute('data-theme');try{sessionStorage.setItem('ds-theme',t)}catch(e){}};var t=new URLSearchParams(location.search).get('theme');if(!t){try{t=sessionStorage.getItem('ds-theme')}catch(e){}}if(t)dsTheme(t)})();</script>
</head>
<body class="product-page">
<svg class="sprite" width="0" height="0" aria-hidden="true"></svg>

  <!-- Product canvas, 1440 wide -->
  <div class="canvas">

    <header class="shared-header">
      <span class="product"><span class="icon logo" aria-hidden="true"></span>AI Stack Builder</span>
    </header>

    <main class="app-main">

      <!-- Sign in (Q25): the minimum the online decision forces. No profile, no settings, no session list.
           After it, you are handed on to where you were — no success screen. -->
      <section class="door" aria-labelledby="door-title">
        <div>
          <h1 id="door-title">Sign in</h1>
          <p class="head-meta">AI Stack Builder is a library for your AI work — skills, agents, prompts, MCP servers, scripts and apps. Keep them in one place, add and edit them, and put them together into projects you can export.</p>
        </div>
        <form class="form">
          <label class="field"><span>Email</span>
            <input type="email" name="email" autocomplete="email" placeholder="maya@chen.dev">
          </label>
          <label class="field"><span class="field-label">Password <a class="meta">Reset password</a></span>
            <input type="password" name="password" autocomplete="current-password">
          </label>
          <a class="button button-primary" href="03-library-my-default.html">Sign in</a>
        </form>
        <p class="door-alt">No account yet? <a>Create account</a></p>
      </section>

    </main>

  </div>

</body>
</html>
