<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Projects · error · filtered — wireframe — design</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&family=Geist+Mono:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../../07-ui-assembly/ui/kit.css">
</head>
<body class="product-page">
<svg class="sprite" width="0" height="0" aria-hidden="true"><symbol id="l-plus" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14" />
  <path d="M12 5v14" /></symbol><symbol id="l-search" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="m21 21-4.34-4.34" />
  <circle cx="11" cy="11" r="8" /></symbol><symbol id="l-search-x" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="m13.5 8.5-5 5" />
  <path d="m8.5 8.5 5 5" />
  <circle cx="11" cy="11" r="8" />
  <path d="m21 21-4.3-4.3" /></symbol><symbol id="l-sliders-horizontal" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="M10 5H3" />
  <path d="M12 19H3" />
  <path d="M14 3v4" />
  <path d="M16 17v4" />
  <path d="M21 12h-9" />
  <path d="M21 19h-5" />
  <path d="M21 5h-7" />
  <path d="M8 10v4" />
  <path d="M8 12H3" /></symbol></svg>

  <!-- Product canvas, 1440 wide -->
  <div class="canvas">

    <header class="app-header">
      <span class="product"><span class="icon logo" aria-hidden="true"></span>AI Stack Builder</span>
      <nav class="app-nav" aria-label="Global">
        <ul>
          <li><a href="../pages/library-my-default.html">My library</a></li>
          <li><a href="../pages/library-public-default.html">Public library</a></li>
          <li><a href="projects-default.html" aria-current="page">Projects</a></li>
        </ul>
      </nav>
      <p class="account" aria-label="Signed in as Maya Chen">
        <img class="image avatar" src="../../06-concept/img/portrait-96.jpg" alt="" width="24" height="24">
        <span>Maya Chen</span>
      </p>
    </header>

    <main class="app-main">

      <section aria-labelledby="projects-title">
        <div class="page-head">
          <h1 id="projects-title">Projects</h1>
          <a class="button button-primary" href="project-empty.html">
            <svg class="icon" aria-hidden="true"><use href="#l-plus"/></svg>New project
          </a>
        </div>
      </section>

      <!-- Find, as it was left: "stripe" typed, one filter on — Not checked yet. -->
      <section aria-label="Find projects">
        <form class="find" role="search" action="projects-default.html">
          <label class="search">
            <svg class="icon" aria-hidden="true"><use href="#l-search"/></svg>
            <input type="search" name="q" value="stripe" placeholder="Search projects and their items — db-migrate, .mcp.json, acme">
          </label>
          <button type="button" class="filters-button"><svg class="icon" aria-hidden="true"><use href="#l-sliders-horizontal"/></svg>Filters · 1</button>
        </form>
      </section>

      <!-- Error: filtered to nothing. The projects exist; the search and filter hide all of them.
           Way out: clear filters — back to the full list. -->
      <section class="state-block" aria-labelledby="none-title">
        <svg class="icon state-icon" aria-hidden="true"><use href="#l-search-x"/></svg>
        <h2 id="none-title">Nothing matches “stripe”</h2>
        <p>The filter shows only projects that are <strong>Not checked yet</strong>.
          You have 5 projects — the search and the filter hide all of them.</p>
        <div class="state-actions">
          <a class="button button-primary" href="projects-default.html">Clear filters</a>
        </div>
      </section>

    </main>
  </div>

</body>
</html>
