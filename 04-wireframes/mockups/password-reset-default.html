<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Reset password · default — wireframe — design</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&family=Geist+Mono:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../../07-ui-assembly/ui/kit.css">
</head>
<body class="product-page">
<svg class="sprite" width="0" height="0" aria-hidden="true"></svg>

  <!-- Product canvas, 1440 wide -->
  <div class="canvas">

    <header class="shared-header">
      <span class="product"><span class="icon logo" aria-hidden="true"></span>AI Stack Builder</span>
    </header>

    <main class="app-main">

      <!-- Reset password (Q35): one field and one action. The success never says whether an account exists for the email. -->
      <section class="door" aria-labelledby="door-title">
        <div>
          <h1 id="door-title">Reset password</h1>
          <p class="head-meta">AI Stack Builder is a library for your AI work — skills, agents, prompts, MCP servers, scripts and apps. Keep them in one place, add and edit them, and put them together into projects you can export.</p>
        </div>
        <form class="form" action="password-reset-success.html">
          <label class="field"><span>Email</span>
            <input type="email" name="email" autocomplete="email" placeholder="maya@chen.dev">
          </label>
          <button type="submit" class="button-primary">Send reset link</button>
        </form>
        <p class="door-alt"><a href="sign-in-default.html">Sign in</a></p>
      </section>

    </main>

  </div>

</body>
</html>
