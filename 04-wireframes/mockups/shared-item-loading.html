<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Shared item · loading — wireframe — design</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&family=Geist+Mono:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../../07-ui-assembly/ui/kit.css">
</head>
<body class="product-page">
<svg class="sprite" width="0" height="0" aria-hidden="true"></svg>

  <!-- Product canvas, 1440 wide -->
  <div class="canvas">

    <header class="shared-header">
      <span class="product"><span class="icon logo" aria-hidden="true"></span>AI Stack Builder</span>
    </header>

    <main class="app-main">

      <section aria-busy="true">
        <p class="visually-hidden" role="status">Loading the shared item</p>
        <span class="skeleton sk-w200 sk-h32"></span>
        <span class="skeleton sk-w440 sk-h12 sk-mt8"></span>
      </section>
      <div class="with-aside" aria-hidden="true">
        <span class="skeleton sk-h240"></span>
        <div class="aside-box"><span class="skeleton sk-w200"></span><span class="skeleton sk-w260 sk-h12"></span></div>
      </div>

    </main>

  </div>

</body>
</html>
