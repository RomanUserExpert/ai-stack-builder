  <!-- Product canvas, 1440 wide -->

        <span class="image avatar" aria-hidden="true"></span>
        <span>Maya Chen</span>

    </header>

          <a class="button button-primary" href="project-empty.html">
            <span class="icon" aria-hidden="true"></span>New project
          </a>
        </div>
      </section>

      <!-- Find stays where it is: the zones do not move between states. -->
      <section aria-label="Find projects">
        <form class="find" role="search" action="projects-default.html">
          <label class="search">
            <span class="icon" aria-hidden="true"></span>
            <input type="search" name="q" placeholder="Search projects and the items in them — db-migrate, .mcp.json, acme">
          </label>
          <button type="button" class="filters-button"><span class="icon" aria-hidden="true"></span>Filters</button>
        </form>
      </section>
