<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>My library · error · server — wireframe</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="wireframe.css">
</head>
<body class="product-page">

  <!-- Product canvas, 1440 wide -->
  <div class="canvas">

    <header class="app-header">
      <span class="product"><span class="icon" aria-hidden="true"></span>AI Stack Builder</span>
      <nav class="app-nav" aria-label="Global">
        <ul>
          <li><a href="library-my-default.html" aria-current="page">My library</a></li>
          <li><a href="library-public-default.html">Public library</a></li>
          <li><a href="projects-default.html">Projects</a></li>
        </ul>
      </nav>
      <!-- The signed-in person. Shown, not a menu: no profile, settings or sessions (Q25, Q29). -->
      <p class="account" aria-label="Signed in as Maya Chen">
        <span class="image avatar" aria-hidden="true"></span>
        <span>Maya Chen</span>
      </p>
    </header>

    <main class="app-main">

      <section aria-labelledby="page-title">
        <div class="page-head">
          <h1 id="page-title">My library</h1>
          <div class="head-actions">
            <a class="button button-primary" href="item-empty.html"><span class="icon" aria-hidden="true"></span>Add item</a>
          </div>
        </div>
      </section>

      <!-- Error: the corpus did not load. No Find, no JSON export: neither can act on a list that is not here.
           Two ways out — try again, or Projects, which does not depend on this list. -->
      <section class="state-block" role="alert" aria-label="Your library didn’t load">
        <span class="icon state-icon" aria-hidden="true"></span>
        <h2>Your library didn’t load</h2>
        <p>The server did not answer, so your items can’t be shown right now.</p>
        <p class="meta">503 · Service unavailable · 14:02</p>
        <div class="state-actions">
          <a class="button button-primary" href="library-my-loading.html"><span class="icon" aria-hidden="true"></span>Try again</a>
          <a class="button" href="projects-default.html">Open Projects</a>
        </div>
      </section>

    </main>

  </div>

</body>
</html>
