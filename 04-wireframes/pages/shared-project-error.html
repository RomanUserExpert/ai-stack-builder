<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Shared project · error — wireframe</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="wireframe.css">
</head>
<body class="product-page">

  <!-- Product canvas, 1440 wide -->
  <div class="canvas">

    <header class="shared-header">
      <span class="product"><span class="icon" aria-hidden="true"></span>AI Stack Builder</span>
    </header>

    <main class="app-main">

      <!-- Error: the dead link — the only place in the product where somebody can be left with nothing at all.
           So it says what happened, what they still have, and gives one real way on. No owner name: it may be gone. -->
      <section class="state-block" aria-label="This link doesn’t open anything any more">
        <span class="image state-image" aria-hidden="true"></span>
        <h2>This link doesn’t open anything any more</h2>
        <p>The person who shared this project turned the link off, or deleted the project. Ask them for a new link. If you already downloaded an archive from it, that copy is still yours.</p>
        <div class="state-actions">
          <a class="button button-primary" href="sign-in-default.html">What is AI Stack Builder?</a>
        </div>
      </section>

    </main>

  </div>

</body>
</html>
