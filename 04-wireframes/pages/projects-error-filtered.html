<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Projects · error · filtered — wireframe</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="wireframe.css">
</head>
<body class="product-page">

  <!-- Product canvas, 1440 wide -->
  <div class="canvas">

    <header class="app-header">
      <span class="product"><span class="icon" aria-hidden="true"></span>AI Stack Builder</span>
      <nav class="app-nav" aria-label="Global">
        <ul>
          <li><a href="library-my-default.html">My library</a></li>
          <li><a href="library-public-default.html">Public library</a></li>
          <li><a href="projects-default.html" aria-current="page">Projects</a></li>
        </ul>
      </nav>
      <!-- The signed-in person. Shown, not a menu: no profile, settings or sessions (Q25, Q29). -->
      <p class="account" aria-label="Signed in as Maya Chen">
        <span class="image avatar" aria-hidden="true"></span>
        <span>Maya Chen</span>
      </p>
    </header>

    <main class="app-main">

      <section aria-labelledby="projects-title">
        <div class="page-head">
          <h1 id="projects-title">Projects</h1>
          <a class="button button-primary" href="project-empty.html">
            <span class="icon" aria-hidden="true"></span>New project
          </a>
        </div>
      </section>

      <!-- Find, as it was left: "stripe" typed, one filter on — Not checked yet. -->
      <section aria-label="Find projects">
        <form class="find" role="search" action="projects-default.html">
          <label class="search">
            <span class="icon" aria-hidden="true"></span>
            <input type="search" name="q" value="stripe" placeholder="Search projects and their items — db-migrate, .mcp.json, acme">
          </label>
          <button type="button" class="filters-button"><span class="icon" aria-hidden="true"></span>Filters · 1</button>
        </form>
      </section>

      <!-- Error: filtered to nothing. The projects exist; the search and filter hide all of them.
           Way out: clear filters — back to the full list. -->
      <section class="state-block" aria-labelledby="none-title">
        <span class="icon state-icon" aria-hidden="true"></span>
        <h2 id="none-title">Nothing matches “stripe”</h2>
        <p>The filter shows only projects that are <strong>Not checked yet</strong>.
          You have 5 projects — the search and the filter hide all of them.</p>
        <div class="state-actions">
          <a class="button button-primary" href="projects-default.html">Clear filters</a>
        </div>
      </section>

    </main>
  </div>

</body>
</html>
