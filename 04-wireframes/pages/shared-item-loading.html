<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Shared item · loading — wireframe</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="wireframe.css">
</head>
<body class="product-page">

  <!-- Product canvas, 1440 wide -->
  <div class="canvas">

    <header class="shared-header">
      <span class="product"><span class="icon" aria-hidden="true"></span>AI Stack Builder</span>
    </header>

    <main class="app-main">

      <section aria-busy="true">
        <p class="visually-hidden" role="status">Opening the shared item</p>
        <span class="skeleton" style="width: 200px; height: 32px"></span>
        <span class="skeleton" style="width: 440px; height: 12px; margin-top: 8px"></span>
      </section>
      <div class="with-aside" aria-hidden="true">
        <span class="skeleton" style="height: 240px"></span>
        <div class="aside-box"><span class="skeleton" style="width: 200px"></span><span class="skeleton" style="width: 260px; height: 12px"></span></div>
      </div>

    </main>

  </div>

</body>
</html>
