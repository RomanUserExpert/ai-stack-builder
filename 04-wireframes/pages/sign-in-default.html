<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Sign in · default — wireframe</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="wireframe.css">
</head>
<body class="product-page">

  <!-- Product canvas, 1440 wide -->
  <div class="canvas">

    <header class="shared-header">
      <span class="product"><span class="icon" aria-hidden="true"></span>AI Stack Builder</span>
    </header>

    <main class="app-main">

      <!-- Sign in (Q25): the minimum the online decision forces. No profile, no settings, no session list.
           After it, you are handed on to where you were — no success screen. -->
      <section class="door" aria-labelledby="door-title">
        <div>
          <h1 id="door-title">Sign in</h1>
          <p class="head-meta">AI Stack Builder is a library for your AI work — skills, agents, prompts, MCP servers, pipelines and harnesses. Keep them in one place, add and edit them, and put them together into projects you can export.</p>
        </div>
        <form class="form" action="sign-in-loading.html">
          <label class="field"><span>Email</span>
            <input type="email" name="email" autocomplete="email" placeholder="maya@chen.dev">
          </label>
          <label class="field"><span class="field-label">Password <a class="meta" href="#">Forgot password?</a></span>
            <input type="password" name="password" autocomplete="current-password">
          </label>
          <button type="submit" class="button-primary">Sign in</button>
        </form>
        <p class="door-alt">No account yet? <a href="sign-up-default.html">Create an account</a></p>
      </section>

    </main>

  </div>

</body>
</html>
