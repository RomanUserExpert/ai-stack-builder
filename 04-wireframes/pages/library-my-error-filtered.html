<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>My library · error · filtered — wireframe</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="wireframe.css">
</head>
<body class="product-page">

  <!-- Product canvas, 1440 wide -->
  <div class="canvas">

    <header class="app-header">
      <span class="product"><span class="icon" aria-hidden="true"></span>AI Stack Builder</span>
      <nav class="app-nav" aria-label="Global">
        <ul>
          <li><a href="library-my-default.html" aria-current="page">My library</a></li>
          <li><a href="library-public-default.html">Public library</a></li>
          <li><a href="projects-default.html">Projects</a></li>
        </ul>
      </nav>
      <!-- The signed-in person. Shown, not a menu: no profile, settings or sessions (Q25, Q29). -->
      <p class="account" aria-label="Signed in as Maya Chen">
        <span class="image avatar" aria-hidden="true"></span>
        <span>Maya Chen</span>
      </p>
    </header>

    <main class="app-main">

      <section aria-labelledby="page-title">
        <div class="page-head">
          <h1 id="page-title">My library</h1>
          <div class="head-actions">
            <a class="button" href="library-json-default.html">Import JSON</a>
            <button type="button">Export JSON</button>
            <a class="button button-primary" href="item-empty.html"><span class="icon" aria-hidden="true"></span>Add item</a>
          </div>
        </div>
      </section>

      <section aria-label="Find">
        <form class="find" role="search">
          <label class="search">
            <span class="icon" aria-hidden="true"></span>
            <input type="search" name="q" value="terraform" placeholder="Search your items by name, description or tag — migrate, GITHUB_TOKEN, review">
          </label>
          <button type="button" class="filters-button"><span class="icon" aria-hidden="true"></span>Filters · 1</button>
        </form>
      </section>

      <!-- Filtered to nothing: the items exist, the search and one filter (kind: agent) hide them all.
           Two ways out: clear filters, or the row that creates — the first item and the thousandth arrive the same way (§8). -->
      <section class="state-block" aria-label="No items match">
        <span class="icon state-icon" aria-hidden="true"></span>
        <h2>No items match</h2>
        <p>Nothing matches “terraform” among your <strong>agents</strong>. You have 10 items — the search and the filter hide all of them.</p>
        <div class="state-actions">
          <a class="button button-primary" href="library-my-default.html">Clear filters</a>
          <a class="button" href="item-empty.html"><span class="icon" aria-hidden="true"></span>Add “terraform” as a new item</a>
        </div>
      </section>

    </main>

  </div>

</body>
</html>
