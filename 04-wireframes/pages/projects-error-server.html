<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Projects · error · server — wireframe</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="wireframe.css">
</head>
<body class="product-page">

  <!-- Product canvas, 1440 wide -->
  <div class="canvas">

    <header class="app-header">
      <span class="product"><span class="icon" aria-hidden="true"></span>AI Stack Builder</span>
      <nav class="app-nav" aria-label="Global">
        <ul>
          <li><a href="library-my-default.html">My library</a></li>
          <li><a href="library-public-default.html">Public library</a></li>
          <li><a href="projects-default.html" aria-current="page">Projects</a></li>
        </ul>
      </nav>
      <!-- The signed-in person. Shown, not a menu: no profile, settings or sessions (Q25, Q29). -->
      <p class="account" aria-label="Signed in as Maya Chen">
        <span class="image avatar" aria-hidden="true"></span>
        <span>Maya Chen</span>
      </p>
    </header>

    <main class="app-main">

      <section aria-labelledby="projects-title">
        <div class="page-head">
          <h1 id="projects-title">Projects</h1>
          <a class="button button-primary" href="project-empty.html">
            <span class="icon" aria-hidden="true"></span>New project
          </a>
        </div>
      </section>

      <!-- Error: the list did not load (Q24 — the product is online). No Find: it has nothing to
           search. Two ways out — try again, or go where the work also lives. New project stays in
           the head: creating does not depend on this list having loaded. -->
      <section class="state-block" aria-labelledby="error-title" role="alert">
        <span class="icon state-icon" aria-hidden="true"></span>
        <h2 id="error-title">Projects didn't load</h2>
        <p>The server did not answer, so your projects can't be shown right now.</p>
        <p class="meta">503 · Service unavailable · 14:02</p>
        <div class="state-actions">
          <a class="button button-primary" href="projects-loading.html"><span class="icon" aria-hidden="true"></span>Try again</a>
          <a class="button" href="library-my-default.html">Open My library</a>
        </div>
      </section>

    </main>
  </div>

</body>
</html>
